[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hale-llm"
version = "0.1.0"
description = "A small, readable decoder-only language-model codebase: transformer, mixture of experts, trained tokenizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=1.23.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tensorboard>=2.18",
    "torch>=2.13.0",
    "tqdm>=4.68.4",
    "transformers>=5.13.1",
]

[project.optional-dependencies]
cloud = ["jarvislabs>=0.2"]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
hale-llm-train = "hale_llm.cli.train:main"
hale-llm-sample = "hale_llm.cli.sample:main"
hale-llm-eval = "hale_llm.cli.eval:main"
hale-llm-tokenizer-ablation = "hale_llm.cli.tokenizer_ablation:main"
hale-llm-infer = "hale_llm.cli.inference:main"
hale-llm-chat = "hale_llm.cli.chat:main"
hale-llm-cloud = "hale_llm.cli.cloud:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hale_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
