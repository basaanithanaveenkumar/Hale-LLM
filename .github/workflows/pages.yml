name: Project page

# Builds the technical report (technical_report/main.tex) and publishes it together with
# the project page in project-page/ to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [masked_diffusion_llm]
    paths:
      - "technical_report/**"
      - "project-page/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile technical report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: technical_report
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r project-page/. _site/
          cp technical_report/main.pdf _site/technical_report.pdf
          mkdir -p _site/static
          cp assets/block_diffusion_step4900.gif _site/static/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
