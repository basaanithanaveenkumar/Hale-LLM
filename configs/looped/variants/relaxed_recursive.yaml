# Looped LM variant `relaxed_recursive` (hale_core.nn.stacks.LOOP_PRESETS["relaxed_recursive"]).
# One shared block plus a small low-rank (LoRA) delta per pass: weight tying becomes a soft
# constraint, so passes can specialise for a few extra parameters.
# Bae et al., Relaxed Recursive Transformers, ICLR 2025, arXiv:2410.20672
# Preset options: n_loops=4, input_injection=none, lora_rank=4
#   hale-llm-train --config configs/looped/variants/relaxed_recursive.yaml
inherits: ../nano.yaml
model:
  loop:
    _delete_: true       # replace nano.yaml's loop section instead of merging into it
    preset: relaxed_recursive
