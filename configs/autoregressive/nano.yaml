inherits: ../base.yaml
variant: autoregressive
device: mps
model:
  d_model: 192
  n_heads: 4
  n_layers: 8
  d_ff: 768
  attn_type: causal
  use_time_cond: false
  max_length: 128
train:
  epochs: 2000
  steps: null
  batch_size: 64
  lr: 0.0003
data:
  source: huggingface
  dataset: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  train_split: train
  val_split: validation
  train_size: null
  val_size: null
  stride_words: 10
  overfit_text: null
eval:
  every_n_epochs: 10
viz:
  every_n_steps: 500
