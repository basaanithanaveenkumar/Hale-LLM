# Looped LM variant `recurrent_depth` (hale_core.nn.stacks.LOOP_PRESETS["recurrent_depth"]).
# Prelude -> shared core x T -> coda, trained with a random T and truncated backprop, so the
# loop count becomes a test-time compute knob.
# Geiping et al., Scaling up Test-Time Compute with Latent Reasoning, 2025, arXiv:2502.05171
# Preset options: n_loops=8, prelude_layers=1, coda_layers=1, depth_embedding=none, input_injection=concat, sandwich_norm=True, min_loops=2, bptt_loops=4
#   hale-llm-train --config configs/looped/variants/recurrent_depth.yaml
inherits: ../nano.yaml
model:
  loop:
    _delete_: true       # replace nano.yaml's loop section instead of merging into it
    preset: recurrent_depth
