model:
  d_model: 384
  n_heads: 8
  n_layers: 16
  d_ff: 1536
  dropout: 0.1
  max_length: 128
  attn_impl: mha
  n_kv_heads: null
  ffn_type: mlp
  moe_num_experts: 4
  moe_top_k: 2
  moe_num_shared: 1
train:
  epochs: 2000
  steps: null
  lr: 0.0003
  batch_size: 32
  weight_decay: 0.01
  log_every: 100
  grad_clip: 1.0
  seed: 0
  checkpoint_path: data/checkpoints/last.pt
  checkpoint_every_epoch: true
  resume: false
  loss_type: ce
  focal_gamma: 2.0
  focal_alpha: 1.0
data:
  source: huggingface
  dataset: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  train_split: train
  val_split: validation
  text_field: text
  cache_dir: null
  tokenizer_name: gpt2
  train_size: null
  val_size: null
  stride_words: 10
  overfit_text: null
  n_overfit_copies: 64
sample:
  max_new_tokens: 64
  temperature: 1.0
  sampling_steps: 32
  eps: 0.001
  prompt: "The meaning of life is"
eval:
  metrics:
    - loss
    - perplexity
    - bits_per_token
    - token_accuracy
    - masked_accuracy
  every_n_epochs: 10
  max_batches: null
viz:
  enabled: true
  every_n_steps: 50
  every_n_epochs: null
  sampling_steps: 8
  prompt_source: dataset
  prompt_words: 8
  output_dir: data/viz
logging:
  level: INFO
  log_file: data/logs/hale_llm.log
  tensorboard: true
  tensorboard_dir: data/tb
  wandb: false
  wandb_project: null
  wandb_entity: null
  wandb_run_name: null
  wandb_tags: null
  wandb_watch_model: false
  wandb_log_freq: 100
experiment:
  enabled: true
  root: data/experiments
  name: null
device: mps
