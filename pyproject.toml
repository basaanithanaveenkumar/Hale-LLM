[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hale-llm"
version = "0.1.0"
description = "Research codebase for comparing language-model paradigms on a shared transformer foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hale-blocks",
    "datasets>=5.0.0",
    "huggingface-hub>=1.23.0",
    "matplotlib>=3.11.1",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tensorboard>=2.18",
    "torch>=2.13.0",
    "tqdm>=4.68.4",
    "transformers>=5.13.1",
    "trackio>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
flash = [
    "flash-attn>=2.0; sys_platform == 'linux'",
]
# Ray Train launcher (train.ray.enabled: true) and WebDataset shards (data.webdataset.enabled: true).
ray = ["hale-blocks[ray]"]
webdataset = ["hale-blocks[webdataset]"]
distributed = ["hale-blocks[ray,webdataset]"]
# Deployment (hale-llm-deploy, docs/deploy.md). `deploy` is the portable core (ONNX + ORT);
# vendor extras add the SDKs that pip can install on their platform. TensorRT engines must be
# built on the target GPU; MIGraphX ships with ROCm (not pip); the QNN SDK / ExecuTorch QNN
# backend come from Qualcomm's QAIRT installer.
deploy = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.2", "safetensors>=0.4"]
deploy-nvidia = [
    "hale-llm[deploy]",
    "tensorrt>=10.0; sys_platform == 'linux'",
    "nvidia-modelopt[onnx,torch]>=0.40; sys_platform == 'linux'",
    "tensorrt-llm>=1.2; sys_platform == 'linux'",
]
deploy-apple = ["hale-llm[deploy]", "mlx>=0.29; sys_platform == 'darwin'", "mlx-lm>=0.28; sys_platform == 'darwin'"]
deploy-amd = ["hale-llm[deploy]", "amd-quark>=0.10"]
deploy-qualcomm = ["hale-llm[deploy]", "qai-hub>=0.30"]

[project.scripts]
hale-llm-train = "hale_llm.cli.train:main"
hale-llm-sample = "hale_llm.cli.sample:main"
hale-llm-eval = "hale_llm.cli.eval:main"
hale-llm-viz = "hale_llm.cli.visualize:main"
hale-llm-explain = "hale_llm.cli.explain:main"
hale-llm-deploy = "hale_llm.deploy.deploy_cli:main"

[tool.uv.sources]
hale-blocks = { git = "https://github.com/basaanithanaveenkumar/HaleBlocks.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/hale_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: end-to-end flow on real configs (slower; may need optional extras)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prose captions and the calibration corpus are user-facing text; wrapping them would change the output.
"src/hale_llm/visualization/explainers/*.py" = ["E501"]
"src/hale_llm/deploy/adapters/calibration_corpus.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
