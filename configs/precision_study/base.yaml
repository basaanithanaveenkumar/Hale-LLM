# Precision study: the same mixture-of-experts model (478M parameters, about 308M active per token)
# trained three times, differing ONLY in `train.lean.precision`. Same seed, data and batches, so the
# curves are directly comparable.
#
# Memory (24 GB A30, fp32 is the run that needs the most): the fp32 weights, gradients and AdamW state
# alone take 7.7 GB, and each MoE layer saves 2.8x the activations of a dense layer. Estimated peak
# (calibrated on the measured dense run: micro-batch 8 = 16.6 GB, micro-batch 16 = out of memory):
#   micro-batch 1 -> ~12 GB | 2 -> ~16-17 GB (about 68%) | 3 -> ~20-22 GB | 4 -> ~25-27 GB (too big)
# So each step is 2 sequences x 8 accumulation steps = 16 x 1024 tokens. Check with `--dry-run` on
# the GPU (it prints peak CUDA memory); batch_size x accum_steps must stay 16.
inherits: ../base.yaml
variant: autoregressive_moe
device: cuda

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  dropout: 0.0              # standard for pretraining; keeps the three runs deterministic in shape
  pos_encoding: rope
  norm_type: rms

data:
  context_window: 1024      # tokens per example = model context length
  train_size: 100000
  val_size: 1000

train:
  steps: null               # run length comes from epochs below
  epochs: 4
  batch_size: 2             # micro-batch; with accum_steps below, 16 x 1024 = 16,384 tokens per step
  lr: 0.0006
  weight_decay: 0.1
  grad_clip: 1.0
  log_every: 50
  seed: 0                   # identical in all three runs
  lean:
    accum_steps: 8            # micro-batches per optimizer step (effective batch = batch_size x this = 16)
    warmup_steps: 100
    warmdown_frac: 0.2
    eval_every: 250
    eval_batches: 20
    keep_best: 5
    best_by: loss
    compile: false

logging:
  tensorboard: true
