model:
  d_model: 384
  n_heads: 8
  n_layers: 16
  d_ff: 1536
  dropout: 0.1
  ffn_type: mlp
  ffn_activation: gelu      # gelu | relu | silu | swiglu | geglu | reglu
  moe_num_experts: 4
  moe_top_k: 2
  moe_num_shared: 1
  moe_router: noisy_topk
  moe_activation: swiglu
  moe_aux_loss_coef: 0.01
  pos_encoding: rope
  norm_type: layer
train:
  epochs: 2000
  steps: null
  lr: 0.0003
  batch_size: 32
  weight_decay: 0.01
  log_every: 100
  grad_clip: 1.0
  seed: 0
  checkpoint_path: data/checkpoints/last.pt
  checkpoint_every_epoch: true
  resume: false
  loss_type: ce
  focal_gamma: 2.0
  focal_alpha: 1.0
data:
  source: huggingface
  dataset: roneneldan/TinyStories
  subset: null
  train_split: train
  val_split: validation
  text_field: text
  cache_dir: null
  tokenizer_name: gpt2
  context_window: 128   # tokens per training example = model context length
  train_size: 100000
  val_size: 1000
  overfit_text: null
  n_overfit_copies: 64
tokenizer:
  # One tokenizer for every run that inherits this file: trained on the first run, reused after.
  # Each run folder also keeps a copy. Use another path (or delete this folder) to change it.
  path: data/tokenizers/tinystories_superbpe_shared
  source: trained        # trained = learn a byte-level tokenizer from this run's data | pretrained = data.tokenizer_name
  kind: superbpe         # superbpe | bpe
  vocab_size: null       # null = chosen from the model size (32,768 under 500M params)
  vocab_policy: by_model_size
  transition_fraction: 0.8
  stage2_max_tokens: 2000000
sample:
  max_new_tokens: 64
  temperature: 1.0
  prompt: "The meaning of life is"
eval:
  metrics:
    - loss
    - perplexity
    - bits_per_token
    - token_accuracy
  every_n_epochs: 10
  max_batches: null
logging:
  level: INFO
  log_file: data/logs/hale_llm.log
  tensorboard: true
  tensorboard_dir: data/tb
experiment:
  enabled: true
  root: data/experiments
  name: null
device: mps
